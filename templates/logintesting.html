<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
    <style>
        body{
            display: flex;
            justify-content: center;
        }



        .L_R-form{margin-top: 50px; }
        
       
        .form_blocks{
            position: relative;
            margin-bottom: 28px;
        }
        input{
            width: 100%;
            padding: 4% 2%;
            font-size: 16px;
            border: 1px solid #999 ;
            outline: none;
        }
        label{
            position: absolute;
            top: 50%;
            left: 10px;
            color: #666;
            font-size: 14px;
            pointer-events: none;
            transform: translateY(-50%);
            transition: 0.3s ease;
            background: white;
            padding: 0 4px;
        }
        /*floting effect */
        input:focus+ label, input:not(:placeholder-shown)+ label {
            top: -6px;
            font-size: 12px;
            color: #2563ed;
        }
        input:focus, input:valid{
             border-color: #2563ed;
        }
        .toggle-eye{
             position: absolute;
             right: 10px;
             top: 50%;
             transform: translateY(-50%);
             cursor: pointer;
             font-size: 16px;
             color: #666;
             user-select: none;
        }
        .toggle-eye:hover{
            color: #2563ed;
        }
       .error{
       position: absolute;
       font-size: 12px;
       color: red;
       transform: translateY(-5px);
       transition: 0.3s ease ;
       opacity: 0;
    }
    .error_match{
       position: absolute;
       font-size: 12px;
       color: red;
       transform: translateY(-5px);
       transition: 0.3s ease ;
       opacity: 0;
    }
    .form_blocks.error-show .error{
        opacity: 1;
        transform: translateY(0);
       }
       .form_blocks.error-show input{
        border-color: red;
       }
       .form_blocks.Perror-show .error_match{
        opacity: 1;
        transform: translateY(0);

       }
       .form_blocks.Perror-show input{
        border-color: red;
       }
       .btn1-2{display: grid; grid-template-columns: 2fr 1fr; gap: 10px; height: 30px;}


       .formbtns2{display: flex; width: 100%;  }
        .formbtns2 button{display: flex; width: 200px; justify-content: center; height: 40px;
        align-items: center;
    }
       .login-form form{
        width: 100%;
        overflow: hidden;
        padding: 5%; 
        /* transform: rotate(90deg); */
       transition: 0.3s ease ;
       border: 1px solid;
       }
       .login-form.active{
        padding: 5%;
        transform: rotate(-90deg);
       transition: 0.3s ease ;
       border: 1px solid;
       }

       .registr-form form{
        width: 100%;
        overflow: hidden;
        padding: 5%;
        /* transform: rotate(90deg); */
       transition: 0.3s ease ;
       border: 1px solid;
       }
       .registr-form.active{
        padding: 5%;
        transform: rotate(-90deg);
       transition: 0.3s ease ;
       border: 1px solid;
       }
    </style>
</head>
<body>
<div class="L_R-form">
    <div class="login-form">
                    <div class="formbtns2">
                        <button type="button" onclick="L_rotate()">Login</button>
                    </div>
            <form novalidate>
                    <div class="form_blocks">
                        <samp>Login</samp>
                    </div>
                    <div class="form_blocks">
                        <input type="email" id="Lemail" placeholder=" " required>
                        <label for="email">E-mail</label>
                        <small class="error" >please enter a valid E-mail</small>
                    </div>
                    <div class="form_blocks">
                        <input type="password" id="Lpassword"  placeholder=" " required>
                        <label for="password">Password</label>
                        <span class="toggle-eye" onclick="LtogglePassword()"><i class="fa-regular fa-eye"></i></span>
                        <small class="error" >please enter password</small>
                    </div>
                    <div class="btn1-2">
                        <button type="submit" >Submit</button>
                        <samp><a href="#">forgot password?</a></samp>
                    </div><br>
                    <div class="form_blocks">
                        <samp>Don't have an account<a href="#">Registration</a></samp>
                    </div>
            </form>
    </div>
    <div class="registr-form">
                    <div class="formbtns2">
                        <button type="button" onclick="R_rotate()">Registration</button>
                    </div>
            <form novalidate>
                    <div class="form_blocks">
                        <samp>Registration</samp>
                    </div>
                    <div class="form_blocks">
                        <input type="text" id="user-name"  placeholder=" " required>
                        <label for="name">User_name</label>
                        <small class="error" >please fill this field</small>
                    </div>
                    <div class="form_blocks">
                        <input type="email" id="email" placeholder=" " required>
                        <label for="email">E-mail</label>
                        <small class="error" >please enter a valid E-mail</small>
                    </div>
                    <div class="form_blocks">
                        <input type="password" id="password"  placeholder=" " required>
                        <label for="password">Password</label>
                        <span class="toggle-eye" onclick="togglePassword()"><i class="fa-regular fa-eye"></i></span>
                        <small class="error" >please enter password</small>
                    </div>
                    <div class="form_blocks">
                        <input type="password" id="conform-password" placeholder=" " required>
                        <label for="password">Password</label>
                        <span class="toggle-eye" onclick="togglePassword1()"><i class="fa-regular fa-eye"></i></span>
                        <small class="error_match">password do not match</small>
                        <small class="error">please enter conform-password</small>
                </div>
                    <div class="btn1-2">
                        <button type="submit" >Submit</button>
                    </div><br>
                    <div class="form_blocks">
                        <samp>Already have an account<a href="#">Login now</a></samp>
                    </div>
            </form>
    </div>

</div>
    <script>

        function L_rotate(){

        }


        const forms = document.querySelectorAll("form");
// >>>>>>>>>>>>>>>>>>>_____login_____>>>>>>>>>>>>>>>>>>>>>>
function LtogglePassword() {
        const passinput = document.getElementById("Lpassword");
        if(passinput.type === "password"){
            passinput.type="text";
        }
        else{
            passinput.type = "password";
        }
       }

      
            
       

        forms[0].addEventListener(
        "submit", function(e){
            e.preventDefault();
            const Lemail = document.getElementById("Lemail");
            const Lpassword = document.getElementById("Lpassword");

            let valid = true;
        //E-mail error block
           if(!Lemail.value.includes('@gmail') || !Lemail.value.includes('.')){
                showError(Lemail);
                valid = false;
            }
            else{
                hideError(Lemail);
            }
            
         //password error block
            if(Lpassword.value.trim() === ""){
                showError(Lpassword);
                valid = false;
            }
            else{
                hideError(Lpassword);
            }
       
        });


// >>>>>>>>>>>>>>>>>>>_____registr_____>>>>>>>>>>>>>>>>>>>>>>
        //password-to-text ---part
       function togglePassword() {
        const passinput = document.getElementById("password");
        if(passinput.type === "password"){
            passinput.type="text";
        }
        else{
            passinput.type = "password";
        }
       }
          function togglePassword1() {
        const passinput = document.getElementById("conform-password");
        if(passinput.type === "password"){
            passinput.type="text";
        }
        else{
            passinput.type = "password";
        }
       }   

       forms[1].addEventListener(
        "submit", function(e){
            e.preventDefault();
            const username = document.getElementById("user-name");
            const email = document.getElementById("email");
            const password = document.getElementById("password");
            const Cpassword = document.getElementById("conform-password");

            let valid = true;
        //user name error block
           if(username.value == ""){
             showError(username);
                valid = false;
           }
            else{
                hideError(username);
            }

        //E-mail error block
            if(!email.value.includes('@gmail') || !email.value.includes('.')){
                showError(email);
                valid = false;
            }
            else{
                hideError(email);
            }
            
        //password error block
            if(password.value.trim() === ""){
                showError(password);
                valid = false;
            }
            else{
                hideError(password);
            }
        // password match block
            if(Cpassword.value.trim() === ""){
                showError(Cpassword);
                valid = false;
            }
            else{
                hideError(Cpassword);
            }

            if(password.value.trim() === ""){
               showError(password);
               valid = false;
            }
            else if(Cpassword.value.trim() === ""){
               hideError(password);
               showError(Cpassword);
               valid = false;
            }
            else if(password.value !== Cpassword.value){
                hideError(password);
                hideError(Cpassword);
                showError1(Cpassword);
                valid = false;
            }
            else{
                hideError1(Cpassword);
            }
        });
      
       function showError(input){
        input.parentElement.classList.add("error-show");
       }
      
       function hideError(input){
        input.parentElement.classList.remove("error-show");
       }
       function showError1(input){
        input.parentElement.classList.add("Perror-show");
       }
       function hideError1(input){
        input.parentElement.classList.remove("Perror-show");
       }

       
    </script>
</body>
</html>
