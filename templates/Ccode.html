<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clean Navbar</title>
    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: system-ui, sans-serif;
}

.header {
    position: sticky;
    top: 0;
    background: #fff;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    z-index: 1000;
}

.nav-container {
    max-width: 1200px;
    margin: auto;
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 30px;
}

/* BRAND */
.brand {
    display: flex;
    align-items: center;
    gap: 10px;
}

.logo {
    width: 42px;
    height: 42px;
    background: linear-gradient(135deg,#2563eb,#3b82f6);
    color: #fff;
    border-radius: 10px;
    display: grid;
    place-items: center;
    font-weight: 700;
}

.brand-text .title {
    font-weight: 700;
    display: block;
}
.brand-text .tagline {
    font-size: 12px;
    color: #666;
}

/* NAV */
.nav {
    flex: 1;
    overflow: hidden;
    border: 1px solid #111;
}

.menu {
    list-style: none;
    display: flex;
    align-items: center;
    gap: 20px;
    white-space: nowrap;
}

.menu li a {
    text-decoration: none;
    color: #111;
    padding: 6px 10px;
    border-radius: 6px;
}

.menu li a:hover {
    background: #f1f5f9;
}

/* MORE */
.more {
    position: relative;
}

.dropdown {
    position: absolute;
    top: 120%;
    right: 0;
    background: #fff;
    box-shadow: 0 6px 20px rgba(0,0,0,0.15);
    border-radius: 8px;
    padding: 8px;
    display: none;
    min-width: 150px;
}

.more:hover .dropdown {
    display: block;
}

.dropdown li {
    list-style: none;
}

.dropdown li a {
    display: block;
    padding: 8px 12px;
}

/* AUTH */
.auth {
    display: flex;
    gap: 12px;
}

.btn {
    padding: 6px 16px;
    border-radius: 20px;
    text-decoration: none;
    font-size: 14px;
}

.btn.fill {
    background: #2563eb;
    color: white;
}

.btn.outline {
    border: 1px solid #2563eb;
    color: #2563eb;
}

/*----------------------------------*/

.calculation{
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px,1fr));
    gap: 10px; 
}
    </style>
</head>
<body>

<header class="header">
    <div class="nav-container">

        <!-- LOGO -->
        <div class="brand">
            <div class="logo">SH</div>
            <div class="brand-text">
                <span class="title">Shopping Website</span>
                <span class="tagline">online shopping platform</span>
            </div>
        </div>

        <!-- NAV -->
        <nav class="nav">
            <ul class="menu">
                <li><a href="#">Home</a></li>
                <li><a href="#">Orders</a></li>
                <li><a href="#">Cart</a></li>
                <li><a href="#">Help</a></li>
                <li><a href="#">Coupons</a></li>
                <li><a href="#">Contact</a></li>
                <li><a href="#">About</a></li>

                <li class="more">
                    <a href="#">More ▾</a>
                    <ul class="dropdown"></ul>
                </li>
            </ul>
        </nav>

        <!-- AUTH -->
        <div class="auth">
            <a class="btn outline" href="#">Sign up</a>
            <a class="btn fill" href="#">Login</a>
        </div>

    </div>
</header>

        <div>
        <button onclick="total()">Data</button>
        </div>
    <div class="calculation">
        
    <div>
    <p id="size"></p>
    <p id="size1"></p>
    <p id="size2"></p>
    </div>
    <div>
    <p id="size3"></p>
    <p id="size4"></p>
    <p id="size5"></p>
    </div>
    <div>
    <p id="size6"></p>
    <p id="size7"></p>
    <p id="size8"></p>
    </div>
    <div>
    <p id="size9"></p>
    <p id="size10"></p>
    <p id="size11"></p>
    </div>
    </div>


<script>
    const nav = document.querySelector(".nav");
const menu = document.querySelector(".menu");
const more = document.querySelector(".more");
const dropdown = document.querySelector(".dropdown");

function updateMenu() {

    // move items INTO dropdown
    while (
         menu.scrollWidth > menu.clientWidth &&
        menu.children.length > 1
    ) {
        dropdown.prepend(menu.children[menu.children.length - 2]);
    }

    // move items BACK to menu
    while (
        dropdown.children.length &&
        menu.scrollWidth <= nav.clientWidth
    ) {
        menu.insertBefore(dropdown.children[0], more);
    }

    // hide "More" if empty
   // more.style.display = dropdown.children.length ? "block" : "none";
}

window.addEventListener("resize", updateMenu);
window.addEventListener("load", updateMenu);



         function total(){
             
             document.getElementById("size").innerHTML= `menu ScrollWidth: [ ${menu.scrollWidth} ]`;
             document.getElementById("size1").innerHTML= `menu.clientWidth: [ ${menu.clientWidth} ]`;
             document.getElementById("size2").innerHTML= `menu.children.length: [ ${menu.children.length} ]`;
             
             document.getElementById("size3").innerHTML= `more.scrollWidth: [ ${more.scrollWidth} ]`;
             document.getElementById("size4").innerHTML= `more.clientWidth: [ ${more.clientWidth} ]`;
             document.getElementById("size5").innerHTML= `more.children.length: [ ${more.children.length} ]`;
             
             document.getElementById("size6").innerHTML= `dropdown.scrollWidth: [ ${dropdown.scrollWidth} ]`;
             document.getElementById("size7").innerHTML= `dropdown.clientWidth: [ ${dropdown.clientWidth} ]`;
             document.getElementById("size8").innerHTML= `dropdown.children.length: [ ${dropdown.children.length} ]`;
             
             document.getElementById("size9").innerHTML= `nav ScrollWidth: [ ${nav.scrollWidth} ]`;
             document.getElementById("size10").innerHTML= `nav clientWidth: [ ${nav.clientWidth} ]`;
             document.getElementById("size11").innerHTML= `nav children.length: [ ${nav.children.length} ]`;
       }
</script>
</body>
</html>
