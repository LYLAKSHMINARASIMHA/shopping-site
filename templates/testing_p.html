<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact & Help Center</title>
    

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
      *{ margin:0; padding:0; box-sizing:border-box; }

         .login-registration{
          display: flex; justify-content: center; height: 250px; margin-top: 100px;
         }
         .lr-block{
          display: grid; align-items: center;
         }
         /* .......................................... */
         .login{display: flex;  height: 50px; width: 170px; 
         }
         .login.act{display: flex; justify-content: center;
           width: 100%; height: auto; padding: 2%;}
         .login.active{display: none;}

         .login-btn{display: flex; align-items: center; width: 100%; justify-content: center;
         border-radius: 10px;}
         .login-btn.active{display: none;}

         .L-form-block{display: none;}
         .L-form-block.active{display: flex; width: 300px; border: 1px solid;}

         /* ///////////////////////////////////////////// */

         .registration{display: flex;  height: 50px; width: 170px; 
        }
         .registration.act{display: flex; width: 100%; height: auto; padding: 2%; }
         .registration.active{display: none; }

         .registration-btn{display: flex; align-items: center; width: 100%; justify-content: center;
         border-radius: 10px;}
         .registration-btn.active{display: none;}

         .R-form-block{display: none;}
         .R-form-block.active{display: flex; width: 300px; border: 1px solid;}
  /* ------------------------------------------------ */
 body{
            margin: 0px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        form{
           max-width: 320px;
           margin: auto;
        }
        .form_blocks{
            position: relative;
            margin-bottom: 28px;
        }
        input{
            width: 100%;
            padding: 12px 10px;
            font-size: 16px;
            border: 1px solid #999 ;
            outline: none;
        }
        label{
            position: absolute;
            top: 50%;
            left: 10px;
            color: #666;
            font-size: 14px;
            pointer-events: none;
            transform: translateY(-50%);
            transition: 0.3s ease;
            background: white;
            padding: 0 4px;
        }
        /*floting effect */
        input:focus+ label, input:not(:placeholder-shown)+ label {
            top: -6px;
            font-size: 12px;
            color: #2563ed;
        }
        input:focus, input:valid{
             border-color: #2563ed;
        }
        .toggle-eye{
             position: absolute;
             right: 10px;
             top: 50%;
             transform: translateY(-50%);
             cursor: pointer;
             font-size: 16px;
             color: #666;
             user-select: none;
        }
        .toggle-eye:hover{
            color: #2563ed;
        }
       .error{
       position: absolute;
       font-size: 12px;
       color: red;
       transform: translateY(-5px);
       transition: 0.3s ease ;
       opacity: 0;
    }
    .error_match{
       position: absolute;
       font-size: 12px;
       color: red;
       transform: translateY(-5px);
       transition: 0.3s ease ;
       opacity: 0;
    }
    .form_blocks.error-show .error{
        opacity: 1;
        transform: translateY(0);
       }
       .form_blocks.error-show input{
        border-color: red;
       }
       .form_blocks.Perror-show .error_match{
        opacity: 1;
        transform: translateY(0);

       }
       .form_blocks.Perror-show input{
        border-color: red;
       }
</style>
</head>
<body>
  <div class="login-registration">
     <div class="lr-block">
       <div class="login">
          <button class="login-btn" type="button">Login</button>
          
          <div class="L-form-block">
              <form novalidate>
                      <div class="form_blocks">
                          <input type="email" id="email" placeholder=" " required>
                          <label for="email">E-mail</label>
                          <small class="error" >please enter a valid E-mail</small>
                      </div>
                      <div class="form_blocks">
                          <input type="password" id="password"  placeholder=" " required>
                          <label for="password">Password</label>
                          <span class="toggle-eye" onclick="togglePassword()"><i class="fa-regular fa-eye"></i></span>
                          <small class="error" >please enter password</small>
                      </div>
                      
                      <div>
                          <button type="submit" >Submit</button>
                      </div>
              </form>
          </div>
       </div>
       <!-- ----------------------------------------------------- -->
       <div class="registration">
          <button class="registration-btn" type="button">Registration</button>
          
          <div class="R-form-block">
              <form novalidate>
                      <div class="form_blocks">
                          <input type="text" id="user-name"  placeholder=" " required>
                          <label for="name">User_name</label>
                          <small class="error" >please fill this field</small>
                      </div>
                      <div class="form_blocks">
                          <input type="email" id="email" placeholder=" " required>
                          <label for="email">E-mail</label>
                          <small class="error" >please enter a valid E-mail</small>
                      </div>
                      <div class="form_blocks">
                          <input type="password" id="password"  placeholder=" " required>
                          <label for="password">Password</label>
                          <span class="toggle-eye" onclick="togglePassword()"><i class="fa-regular fa-eye"></i></span>
                          <small class="error" >please enter password</small>
                      </div>
                      <div class="form_blocks">
                          <input type="password" id="conform-password" placeholder=" " required>
                          <label for="password">Password</label>
                          <span class="toggle-eye" onclick="togglePassword1()"><i class="fa-regular fa-eye"></i></span>
                          <small class="error_match">password do not match</small>
                          <small class="error">please enter conform-password</small>
                      </div>
                      <div>
                            <button type="submit" >Submit</button>
                      </div>
              </form>
          </div>
       </div>
     </div>
  </div>
  
  <script>


    const login_on = document.querySelector(".login-btn");
    const regist_on = document.querySelector(".registration-btn");

    const login_form = document.querySelector(".login");
    const regist_form = document.querySelector(".registration");

    const L_form_block = document.querySelector(".L-form-block");
    const R_form_block = document.querySelector(".R-form-block");
    
    login_on.addEventListener("click", ()=>{
      login_on.classList.toggle("active");
      regist_form.classList.toggle("active");
      L_form_block.classList.toggle("active");
      login_form.classList.toggle("act");
    })
    
    
    regist_on.addEventListener("click", ()=>{
      regist_on.classList.toggle("active");
      login_form.classList.toggle("active");
      R_form_block.classList.toggle("active");
      regist_form.classList.toggle("act");
    })



    function togglePassword() {
        const passinput = document.getElementById("password");
        if(passinput.type === "password"){
            passinput.type="text";
        }
        else{
            passinput.type = "password";
        }
       }
          function togglePassword1() {
        const passinput = document.getElementById("conform-password");
        if(passinput.type === "password"){
            passinput.type="text";
        }
        else{
            passinput.type = "password";
        }
       }   

       document.querySelector("form").addEventListener(
        "submit", function(e){
            e.preventDefault();
            const username = document.getElementById("user-name");
            const email = document.getElementById("email");
            const password = document.getElementById("password");
            const Cpassword = document.getElementById("conform-password");

            let valid = true;
        //user name error block
           if(username.value == ""){
             showError(username);
                valid = false;
           }
            else{
                hideError(username);
            }

        //E-mail error block
            if(!email.value.includes('@gmail') || !email.value.includes('.')){
                showError(email);
                valid = false;
            }
            else{
                hideError(email);
            }
            
        //password error block
            if(password.value.trim() === ""){
                showError(password);
                valid = false;
            }
            else{
                hideError(password);
            }
        // password match block
            if(Cpassword.value.trim() === ""){
                showError(Cpassword);
                valid = false;
            }
            else{
                hideError(Cpassword);
            }

            if(password.value.trim() === ""){
               showError(password);
               valid = false;
            }
            else if(Cpassword.value.trim() === ""){
               hideError(password);
               showError(Cpassword);
               valid = false;
            }
            else if(password.value !== Cpassword.value){
                hideError(password);
                hideError(Cpassword);
                showError1(Cpassword);
                valid = false;
            }
            else{
                hideError1(Cpassword);
            }
        });
      
       function showError(input){
        input.parentElement.classList.add("error-show");
       }
      
       function hideError(input){
        input.parentElement.classList.remove("error-show");
       }
       function showError1(input){
        input.parentElement.classList.add("Perror-show");
       }
       function hideError1(input){
        input.parentElement.classList.remove("Perror-show");
       }

  </script>
</body>
</html>
