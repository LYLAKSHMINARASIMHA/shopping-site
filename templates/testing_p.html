<!DOCTYPE html>
<html>
  <head>
  <style>
   .imageblock img{width: 100%; object-fit: cover;}
    .imageblock{ display: grid; grid-template-columns: repeat(4, minmax(250px, 1fr)); 
    border-radius: 10px; box-shadow: 0,0,0,0.50 black; gap: 10px; }
    .imgblock{display: flex; overflow: hidden; border: 1px solid black; border-radius: 10px;}
  </style>
  </head>
  <body>
       <div class="imageblock">
        {% for image in imageId %}
        <div class="imgblock">
        <img src="{{url_for('static', filename =image) }}" alt="it's image">
        </div>
        {% endfor %}
       </div>
  </body>
</html>
