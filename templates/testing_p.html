<html>
    <head>
        <style>


.chart-box{
    width: 70%;
    background: white;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 0 10px rgba(0,0,0,.1);
}

    height:350px;

        </style>
    </head>
    <body>
    <div class="chart-box">
    <h2>Revenue Overview (Last 7 Days)</h2>

        <canvas id="revenueChart"></canvas>
    </div>


<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    const revenue = "{{ revenue | tojson }}";
    
    const ctx = document.getElementById('revenueChart');

new Chart(ctx,{
    type:'line',
    data:{
        labels:['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],
        datasets:[{
            label:'Revenue',
            data:[7500,14500,10000,16500,22000,15000,20500],
            borderColor:'blue',
            backgroundColor:'rgba(0,0,255,0.1)',
            fill:true,
            tension:0.4
        }]
    }
});

            </script>
    </body>
